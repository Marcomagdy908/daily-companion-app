# ═════════════════════════════════════════════════════════════════════
# GitHub Actions — بناء APK تلقائي عند كل push
# ═════════════════════════════════════════════════════════════════════
# الملف ده بيشتغل تلقائي على GitHub Actions.
# كل ما تعمل push على branch main، الـ APK هيتبني تلقائيًا.
# تنزّله من: GitHub → Actions → آخر workflow → Artifacts
# ═════════════════════════════════════════════════════════════════════

name: بناء APK لرفيق يومي

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # يسمح بتشغيل يدوي من GitHub

jobs:
  build-android:
    name: بناء APK للأندرويد
    runs-on: ubuntu-latest

    steps:
      # 1. جيب الكود
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. ثبّت Java
      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. ثبّت Flutter
      - name: إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. تحقق من الإصدارات
      - name: عرض معلومات البيئة
        run: |
          flutter --version
          java -version

      # 5. نزّل المكتبات
      - name: تنزيل مكتبات Flutter
        run: flutter pub get

      # 5.5 أنشئ هيكل مشروع الأندرويد (android/) لو مش موجود
      #     ملاحظة: المشروع ده بيحتوي على كود Dart بس من غير هيكل
      #     الأندرويد الأصلي. flutter create بيولّده تلقائي بإصدارات
      #     Gradle/AGP/Kotlin متوافقة مع نسخة Flutter الحالية، وده
      #     بيمنع مشاكل تعارض الفيرجن اللي بتحصل لو الهيكل اتعمل يدوي
      #     بإصدارات قديمة أو غير متوافقة.
      - name: توليد هيكل مشروع الأندرويد
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android \
              --org com.dailycompanion \
              --project-name daily_companion
          else
            echo "مجلد android موجود بالفعل، تخطي"
          fi

      # 5.6 فعّل core library desugaring (مطلوب لـ flutter_local_notifications v18+)
      - name: تفعيل core library desugaring في Gradle
        run: |
          python3 - <<'PYEOF'
          import os

          groovy = "android/app/build.gradle"
          kts = "android/app/build.gradle.kts"
          path = groovy if os.path.exists(groovy) else kts

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          already_enabled = (
              "isCoreLibraryDesugaringEnabled" in content
              or "coreLibraryDesugaringEnabled" in content
          )

          if already_enabled:
              print("desugaring مفعّل بالفعل، تخطي")
          else:
              is_kts = path.endswith(".kts")
              if is_kts:
                  content = content.replace(
                      "compileOptions {",
                      "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                      1,
                  )
                  dep_line = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n'
              else:
                  content = content.replace(
                      "compileOptions {",
                      "compileOptions {\n        coreLibraryDesugaringEnabled true",
                      1,
                  )
                  dep_line = "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n"

              if "dependencies {" in content:
                  content = content.replace("dependencies {", "dependencies {\n" + dep_line, 1)
              else:
                  content += "\ndependencies {\n" + dep_line + "}\n"

              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print(f"تم تعديل {path}")
          PYEOF

      # 6. ولّد الكود الآلي
      - name: توليد الكود الآلي (freezed / riverpod)
        run: dart run build_runner build --delete-conflicting-outputs

      # 7. افحص جودة الكود (لا يوقف البناء عند التحذيرات)
      - name: تحليل الكود
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # 8. ابنِ APK للإنتاج
      - name: بناء APK للإنتاج
        run: flutter build apk --release

      # 9. ابنِ APK مقسّم لأحجام أصغر
      - name: بناء APK مقسّم حسب المعمارية
        run: flutter build apk --split-per-abi --release

      # 10. ارفع الـ APK كـ Artifact
      - name: رفع APK الكامل
        uses: actions/upload-artifact@v4
        with:
          name: daily-companion-apk-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: رفع APK المقسّم حسب المعمارية
        uses: actions/upload-artifact@v4
        with:
          name: daily-companion-apk-split
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 90

      # 11. (اختياري) نشر إصدار على GitHub Releases عند إنشاء tag
      - name: إنشاء GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          name: رفيق يومي ${{ github.ref_name }}
          body: |
            ## 🌿 رفيق يومي — إصدار ${{ github.ref_name }}

            حمّل الملف المناسب لجهازك:
            - **app-release.apk** — يشتغل على كل الأجهزة (حجم أكبر)
            - **app-arm64-v8a-release.apk** — للأجهزة الحديثة (2018+)
            - **app-armeabi-v7a-release.apk** — للأجهزة القديمة
            - **app-x86_64-release.apk** — للمحاكيات فقط

            ### طريقة التثبيت:
            1. حمّل الملف على تليفونك
            2. فعّل "Install from Unknown Sources" في الإعدادات
            3. افتح الملف ثبّت
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
