
name: daily_companion
description: "رفيق يومي - Daily Companion: A spiritual growth mobile app built on mutual giving."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ^3.24.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1


  # Navigation
  go_router: ^14.6.2

  # Storage & Caching
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # UI & Animation
  lottie: ^3.1.3
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^1.2.0+3
  shimmer: ^3.0.0
  confetti: ^0.8.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  timezone: ^0.9.4
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/data/

dependency_overrides:
  analyzer_plugin: ^0.13.0
